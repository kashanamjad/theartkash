<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Artkash — Film &amp; photo studio, Dubai</title>
<meta name="description" content="The Artkash is a film and photo studio in Dubai: brand and commercial films, event coverage, photography, social content and post-production.">
<meta property="og:title" content="The Artkash — Got something to shoot?">
<meta property="og:description" content="Film and photo studio in Dubai.">
<meta property="og:image" content="https://theartkash.com/assets/media/brand/icon-512.png">
<meta property="og:url" content="https://theartkash.com/">
<meta name="theme-color" content="#f3f0ec">
<link rel="icon" type="image/png" href="/assets/media/brand/favicon-64.png">
<link rel="apple-touch-icon" href="/assets/media/brand/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/site.css?v=2">
</head>
<body>

<!-- ============ HERO ============ -->
<header class="hero" id="top">
  <div class="bar">
    <a class="wm" href="#top" aria-label="The Artkash"><span class="t">the</span><span class="b">ARTKASH</span></a>
    <nav class="nav"><a href="#services">Services</a><a href="#work">Work</a><a href="#team">Team</a><a href="#contact">Contact</a></nav>
  </div>
  <div id="frames"></div>
  <div class="hero-center">
    <img class="hero-mark" src="/assets/media/brand/mark.png" alt="The Artkash">
    <h1 id="headline"><span class="w">Got</span> <span class="w">something</span> <span class="w">to</span> <span class="w brush">shoot?</span></h1>
    <a class="link" href="#services"><span id="hero-button">What we do</span> <i class="ar"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M6 13l6 6 6-6"/></svg></i></a>
  </div>
  <div class="hint" id="hint">Hover a photo to bring it forward</div>
</header>

<!-- ============ SERVICES ============ -->
<section class="block" id="services">
  <div class="wrap">
    <div class="head"><h2 data-d="8"><span class="hb">What we do</span></h2></div>
    <div class="services focus-group" id="services-list"></div>
  </div>
</section>

<!-- ============ WORK ============ -->
<section class="block" id="work">
  <div class="wrap">
    <div class="head">
      <h2 data-d="8"><span class="hb">Work</span></h2>
      <div class="tabs"><button class="on" data-tab="films">Films</button><button data-tab="photos">Photos</button></div>
    </div>
  </div>
  <div class="deck" id="deck" data-d="14" aria-roledescription="carousel" aria-label="Work"></div>
  <div class="wrap">
    <div class="deck-foot">
      <div class="cap" id="cap" data-d="5"><b></b><span></span></div>
      <div class="nav-btns">
        <button class="rb" id="prev" aria-label="Previous"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg></button>
        <button class="rb" id="next" aria-label="Next"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5l7 7-7 7"/></svg></button>
      </div>
    </div>
    <div class="more"><a class="link" id="more-work" href="https://kashanamjad.com"><span>See more work</span> <i class="ar"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17 17 7M9 7h8v8"/></svg></i></a></div>
  </div>
</section>

<!-- ============ TEAM ============ -->
<section class="block" id="team">
  <div class="wrap">
    <div class="head"><h2 data-d="8"><span class="hb">The team</span></h2></div>
    <div class="team focus-group" id="team-list"></div>
  </div>
</section>

<!-- ============ CONTACT ============ -->
<section class="contact" id="contact">
  <div class="wrap">
    <img class="mark" data-d="18" src="/assets/media/brand/mark-on-red.png" alt="The Artkash">
    <h2 data-d="9" id="contact-h">Have a shoot coming up?</h2>
    <p id="contact-p">Tell us what you're planning. We'll get back to you within a day.</p>
    <div class="ways" data-d="4" id="ways"></div>
  </div>
</section>

<footer>
  <div class="wrap">
    <a href="#top" class="foot-mark" aria-label="Back to top"><img src="/assets/media/brand/mark-on-red.png" alt="The Artkash"></a>
    <span id="foot">Dubai, UAE · © 2026 The Artkash</span>
  </div>
</footer>

<script src="/assets/js/site.js?v=2"></script>
</body>
</html>
