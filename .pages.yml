# Pages CMS admin (https://app.pagescms.org). Edits content/site.json and uploads to assets/media.
media:
  input: assets/media
  output: /assets/media

content:
  - name: site
    label: Website
    type: file
    path: content/site.json
    format: json
    fields:
      - name: hero
        label: Opening screen
        type: object
        fields:
          - { name: headline, label: Headline (before the brush), type: string, default: "Got something to" }
          - { name: headline_brush, label: Word on the brush, type: string, default: "shoot?" }
          - { name: button, label: Button under the headline, type: string, default: "What we do" }
          - { name: photos, label: Floating photos, type: image, list: true, description: "Up to 17. The first four are the large sharp ones nearest the headline. JPG about 900px wide. Each spot crops to its own shape, so keep the subject centred." }

      - name: services
        label: What we do
        type: object
        list: true
        fields:
          - { name: icon, label: Icon, type: select, options: { values: [film, event, camera, social, post] } }
          - { name: title, label: Title, type: string }
          - { name: text, label: Short line, type: string }

      - name: films
        label: Work – films
        description: Shown in this order in the slider. Put horizontal films first, then vertical reels.
        type: object
        list: true
        fields:
          - { name: client, label: Client, type: string }
          - { name: title, label: Film title, type: string }
          - { name: video, label: Video (MP4), type: file, description: "H.264 MP4, 720p–1080p, ideally under 20 MB." }
          - { name: poster, label: Poster image, type: image, description: "A still from the film, same shape as the video." }
          - { name: shape, label: Shape, type: select, options: { values: [horizontal, vertical] }, default: horizontal }

      - name: photos
        label: Work – photos
        type: object
        list: true
        fields:
          - { name: client, label: Client, type: string }
          - { name: title, label: Caption, type: string }
          - { name: image, label: Photo, type: image }

      - name: more_work
        label: "'See more work' link"
        type: object
        fields:
          - { name: label, label: Text, type: string }
          - { name: url, label: Link, type: string }

      - name: team
        label: Team
        type: object
        list: true
        fields:
          - { name: name, label: Name, type: string }
          - { name: role, label: Role, type: string }
          - { name: photo, label: Cut-out photo (PNG with transparent background), type: image, description: "Leave empty to show a grey placeholder." }
          - { name: link, label: Link (optional), type: string, description: "Opens in a new tab when the photo or name is clicked." }

      - name: contact
        label: Contact
        type: object
        fields:
          - { name: headline, label: Headline, type: string }
          - { name: text, label: Line under headline, type: string }
          - { name: email, label: Email, type: string }
          - { name: whatsapp, label: WhatsApp number, type: string, description: "With country code, e.g. +971 50 123 4567" }
          - { name: whatsapp_message, label: Pre-filled WhatsApp message, type: string }
          - { name: instagram, label: Instagram link, type: string }

      - { name: footer, label: Footer text, type: string }
